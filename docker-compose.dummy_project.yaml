services:
  training:
    build:
      context: .
      dockerfile: Dockerfile.dummy_project
    volumes:
    - "${ML_HOMELAB_ROOT}:${ML_HOMELAB_ROOT}:rw"
    env_file:
      - "${ML_HOMELAB_ROOT}/.terraform_envs"
    environment:
      - ML_HOMELAB_ROOT=${ML_HOMELAB_ROOT}
      - PROJECT_NAME=${PROJECT_NAME}
      - MODE=${MODE}
      - DOCKER_NETWORK_NAME=${DOCKER_NETWORK_NAME}
      - TIMESTAMP=${TIMESTAMP}
      - OUTPUT_SUFFIX=${OUTPUT_SUFFIX}
    networks: 
      - external_net

networks:
  external_net:
    external: true
    name: ${DOCKER_NETWORK_NAME}